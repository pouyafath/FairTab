services:
  fairtab:
    build: .
    image: fairtab:latest
    container_name: fairtab
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # SQLite database and uploaded receipts live here — back up this directory
      - ./data:/data
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/fairtab.db
      UPLOADS_DIR: /data/uploads
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Optional site-wide PIN gate — set APP_ACCESS_PIN in .env to enable
      APP_ACCESS_PIN: ${APP_ACCESS_PIN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
