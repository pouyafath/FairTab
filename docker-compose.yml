services:
  fairtab:
    build: .
    image: fairtab:latest
    container_name: fairtab
    restart: unless-stopped
    ports:
      # Override FAIRTAB_PORT_BINDING in .env to restrict to a specific interface.
      # Default: localhost only. Production example: 100.72.25.41:3000:3000
      - "${FAIRTAB_PORT_BINDING:-127.0.0.1:3000:3000}"
    volumes:
      # Override FAIRTAB_DATA_DIR in .env to store the database outside the repo.
      # Default: ./data (gitignored). Production example: /srv/data/fairtab
      - "${FAIRTAB_DATA_DIR:-./data}:/data"
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/fairtab.db
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
